# SPRING
spring.application.name=notification-service
server.port=8086
server.servlet.context-path=/notifications
spring.config.import=optional:file:.env[.properties]

# EUREKA
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8081/eureka}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.fetch-registry=true


# RABBIMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rota-facil}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

# exchange

rabbitmq.transport.exchange=${RABBITMQ_TRANSPORT_EXCHANGE:transport.events}
rabbitmq.auth.exchange=${RABBITMQ_AUTH_EXCHANGE:auth.events}

# queues

rabbitmq.notification.trip.cancelled.queue=${RABBITMQ_NOTIFICATION_TRIP_CANCELLED_QUEUE:notification.trip.cancelled.queue}
rabbitmq.notification.trip.running.queue=${RABBITMQ_NOTIFICATION_TRIP_RUNNING_QUEUE:notification.trip.running.queue}
rabbitmq.notification.user.feedback.queue=${RABBITMQ_NOTIFICATION_USER_FEEDBACK_QUEUE:notification.user.feedback.queue}
rabbitmq.notification.user.created.queue=${RABBITMQ_NOTIFICATION_USER_CREATED_QUEUE:notification.user.created.queue}
rabbitmq.notification.user.deleted.queue=${RABBITMQ_NOTIFICATION_USER_DELETED_QUEUE:notification.user.deleted.queue}

# routing key

rabbitmq.trip.cancelled.routing.key=${RABBITMQ_TRIP_CANCELLED_ROUTING_KEY:trip.cancelled}
rabbitmq.trip.running.routing.key=${RABBITMQ_TRIP_RUNNING_ROUTING_KEY:trip.running}
rabbitmq.user.feedback.routing.key=${RABBITMQ_USER_FEEDBACK_ROUTING_KEY:user.feedback}
rabbitmq.user.created.routing.key=${RABBITMQ_USER_CREATED_ROUTING_KEY:user.created}
rabbitmq.user.deleted.routing.key=${RABBITMQ_USER_DELETED_ROUTING_KEY:user.deleted}


# OBSERVABILITY
# traces
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# metrics
management.otlp.metrics.export.enabled=true

# collector
management.otlp.tracing.endpoint=${COLLECTOR_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.url=${COLLECTOR_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

